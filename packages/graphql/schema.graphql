}

"""Fields to set; omitted fields stay as they are."""
input UpdateHelperProfileInput {
  """Changing away from BUSINESS removes the business details."""
  status: HelperStatus = null

  """Only with the BUSINESS status."""
  business: HelperBusinessInput = null

  """
  The registered business address, only with the BUSINESS status. The poster of a task sees it on the helper's offer, at checkout and in the contract confirmation; the public profile shows only the town.
  """
  businessAddress: HelperBusinessAddressInput = null
  legalFirstName: String = null
  legalLastName: String = null
  birthDate: Date = null
  address: HelperAddressInput = null
  oib: String = null

  """An EU account; spaces are ignored."""
  iban: String = null

  """Empty string ("") removes it."""
  vatId: String = null
  residenceCountry: String = null

  """Replaces the service areas; IDs from serviceAreas."""
  serviceAreaIds: [ID!] = null

  """Replaces the categories."""
  categories: [TaskCategory!] = null
}

"""Fields to change; omit all of them to confirm the offer as it is."""
input UpdateOfferInput {
  priceCents: Int = null
  message: String = null
}

"""A photo the signed-in user uploaded."""
type Upload {
  id: ID!
  purpose: UploadPurpose!
  status: UploadStatus!
  contentType: String!
  sizeBytes: Int!
  width: Int
  height: Int

  """
  UPLOAD_INVALID_IMAGE, UPLOAD_TOO_LARGE or UPLOAD_CHANGED when REJECTED.
  """
  rejectionCode: ErrorCode

  """
  Where to load the photo once READY. Until a task photo is published (after a task claims it), and always for an evidence photo, the URL is valid for a few minutes; query again for a fresh one.
  """
  url: String
}

"""What a photo is for. Decides who may see it and what is kept."""
enum UploadPurpose {
  """Shown to other users; stored without any metadata (no GPS)."""
  TASK_PHOTO

  """
  Proof for a booking. Private; its capture time and position are kept server-side and viewers see a copy without metadata.
  """
  EVIDENCE_PHOTO
}

"""Where an upload is in its life."""
enum UploadStatus {
  """Waiting for the PUT and completeUpload."""
  PENDING

  """Received; being checked and cleaned."""
  PROCESSING

  """Ready to use; `url` is set for the owner."""
  READY

  """Not a valid image; see `rejectionCode`."""
  REJECTED
}

"""
Where to PUT the file: send the bytes as the body with exactly `contentType` as the Content-Type header and the declared size, before `expiresAt`. Then call completeUpload. Its `id` is the upload's.
"""
type UploadTarget {
  id: ID!
  upload: Upload!
  url: String!

  """Always "PUT"."""
  method: String!
  contentType: String!
  expiresAt: DateTime!
}

"""The signed-in account, as its owner sees it."""
type User {
  id: ID!
  email: String!
  firstName: String!
  lastName: String!
  locale: Locale!

  """ISO 3166-1 alpha-2 country code."""
  country: String!

  """IANA time zone, e.g. "Europe/Berlin"."""
  timeZone: String!

  """
  Whether the mobile number is verified; posting, offering and chat need it.
  """
  phoneVerified: Boolean!

  """
  The verified mobile number, masked ("+385 ••• 678"); null until verified. Only its owner ever sees it.
  """
  phoneNumberMasked: String

  """
  ACTIVE, or the limited mode the account is in: TERMS_UPDATE_REQUIRED until the terms version in force is accepted, SUSPENDED, or DELETION_PENDING.
  """
  accountState: AccountState!

  """
  Whether the terms version in force still has to be accepted: show "We've updated our terms" with `termsToAccept` and call acceptCurrentTerms. True also while the account is SUSPENDED or DELETION_PENDING, whose state `accountState` reports first.
  """
  mustAcceptTerms: Boolean!

  """
  What "We've updated our terms" shows, in `language`: the version in force while it still has to be accepted, null otherwise. The tick box names its `version` and `effectiveAt`; send that version to acceptCurrentTerms. Its `kind` says which document it is (TERMS today; HELPER_TERMS once helpers re-accept helper terms).
  """
  termsToAccept(language: Locale!): LegalDocument

  """
  The obrt or company you book for, or null. While it is set, your tasks take offers from registered helpers only.
  """
  posterBusiness: PosterBusiness
}

"""
A place on the waitlist for a city. Only what the caller sent comes back, so the answer doesn't tell whether the address was already on the list.
"""
type WaitlistEntry {
  id: ID!
  city: String!
  countryCode: String!
  category: TaskCategory!
}
