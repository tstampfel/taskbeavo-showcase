}

"""A kind of legal document."""
enum LegalDocumentKind {
  TERMS
  HELPER_TERMS
  PRIVACY
  CANCELLATION
  COOKIES
  IMPRINT
}

"""A language TaskBeavo is available in."""
enum Locale {
  HR
  EN
  DE
  FR
}

type Mutation {
  """
  Email a 6-digit sign-in code, valid 10 minutes. Always returns true, whether or not the address has an account. `locale` is the app's current language, used for the email when the address has no account yet. At most 5 per address per hour. Errors: INVALID_EMAIL, RATE_LIMITED and LOCKED (both with extensions.retryAfterSeconds).
  """
  requestEmailCode(email: String!, locale: Locale!): Boolean!

  """
  Check a sign-in code. An existing account gets a session; a new address gets AccountDetailsRequired. A sign-in from a new device emails the account a notice. Errors: INVALID_EMAIL, INVALID_CODE, LOCKED (5 wrong codes lock the address for 30 minutes, with extensions.retryAfterSeconds).
  """
  verifyEmailCode(email: String!, code: String!, device: DeviceInput!): SignInResult!

  """
  A one-time nonce, valid until its expiresAt, to start a Google or Apple sign-in.
  """
  requestSignInNonce: SignInNonce!

  """
  Sign in with a Google or Apple ID token. A known provider account gets a session; an email that already has an account gets ProviderLinkRequired (a code is emailed to it); a new one gets AccountDetailsRequired, then completeAccountDetails as for email. Errors: INVALID_PROVIDER_TOKEN, PROVIDER_UNAVAILABLE, PROVIDER_EMAIL_MISSING, and RATE_LIMITED or LOCKED when a link code can't be sent.
  """
  signInWithProvider(input: ProviderSignInInput!, device: DeviceInput!): ProviderSignInResult!

  """
  Add the Google or Apple sign-in from ProviderLinkRequired to the account, using the code emailed to it, and sign in. Errors: INVALID_CODE, LOCKED, SIGNUP_TICKET_EXPIRED (start the Google or Apple sign-in again).
  """
  linkProviderWithEmailCode(ticket: String!, code: String!, device: DeviceInput!): AuthSession!

  """
  Create the account and sign in, recording that it accepted the terms in force. Errors: SIGNUP_TICKET_EXPIRED, UNDERAGE, INVALID_ACCOUNT_DETAILS, TERMS_NOT_ACCEPTED.
  """
  completeAccountDetails(details: AccountDetailsInput!, device: DeviceInput!): AuthSession!

  """
  Trade a refresh token for new tokens; the old one stops working. Errors: SESSION_EXPIRED (sign in again).
  """
  refreshSession(refreshToken: String!): AuthSession!

  """
  Sign out this session and close its open subscription WebSockets. Always returns true.
  """
  signOut(refreshToken: String!): Boolean!

  """
  Log out of all devices: revoke every session of the signed-in user, this one included, and close their open subscription WebSockets. Always returns true. Errors: UNAUTHENTICATED.
  """
  signOutEverywhere: Boolean!

  """
  "This wasn't me": the token from the new-device email's link logs that account out of all devices, without signing in. Always returns true when the token is good. Errors: SIGN_OUT_LINK_EXPIRED.
  """
  signOutEverywhereFromEmail(token: String!): Boolean!

  """
  Save the language the signed-in user chose; emails, push and SMS follow it. Errors: UNAUTHENTICATED.
  """
  setLocale(locale: Locale!): User!

  """
  Accept the updated terms from "We've updated our terms": `version` is `currentLegalDocument(kind: TERMS)`'s version and `language` the language it was shown in. Ends TERMS_UPDATE_REQUIRED; accepting a version again changes nothing. Errors: UNAUTHENTICATED, TERMS_NOT_ACCEPTED (the version isn't the one in force any more: fetch it and show it again).
  """
  acceptCurrentTerms(version: String!, language: Locale!): User!

  """
  Text a 6-digit code to the signed-in user's mobile number, valid 10 minutes. `phone` is international (+49 151 23456789) or national in the account's country. Errors: UNAUTHENTICATED, INVALID_PHONE_NUMBER, PHONE_COUNTRY_NOT_SUPPORTED, RATE_LIMITED (with extensions.retryAfterSeconds), SMS_NOT_SENT.
  """
  requestPhoneCode(phone: String!): PhoneCodeSent!

  """
  Check the SMS code from requestPhoneCode and save the number as verified. Errors: UNAUTHENTICATED, INVALID_CODE, PHONE_NUMBER_IN_USE, RATE_LIMITED.
  """
  verifyPhoneCode(code: String!): User!

  """
  Book for your obrt or company. From then on your tasks take offers from registered helpers only: private helpers' open offers on them are withdrawn and they are told why. Errors: UNAUTHENTICATED, INVALID_POSTER_BUSINESS, INVALID_OIB, INVALID_BUSINESS_OIB, POSTER_BUSINESS_CHECKOUT_OPEN.
  """
  setPosterBusiness(input: PosterBusinessInput!): User!

  """
  Stop booking for a business. Offers withdrawn meanwhile stay withdrawn. Errors: UNAUTHENTICATED.
  """
  clearPosterBusiness: User!

  """
  A token for the subscriptions WebSocket's connection_init `authToken`, valid about a minute. For the web app, whose access token page code can't read. Errors: UNAUTHENTICATED.
  """
  webSocketToken: String!

  """
  Join the waitlist for a city TaskBeavo doesn't serve yet, e.g. after OUT_OF_SERVICE_AREA. Needs no sign-in. Joining again for the same email and city updates that entry. Errors: WAITLIST_CONSENT_REQUIRED, INVALID_EMAIL, INVALID_WAITLIST_DETAILS.
  """
  joinWaitlist(input: JoinWaitlistInput!): WaitlistEntry!

  """
  Leave the waitlist with the token from the launch email's link, withdrawing the consent: the entry is deleted. Needs no sign-in. Always returns true, whether or not the token matched an entry.
  """
  leaveWaitlist(token: String!): Boolean!

  """
  Accept an offer on your task and open its checkout; nothing is charged until you confirm the payment with Stripe. `expectedPriceCents` is the price you saw and `expectedTotalCents` the total on the pay button (price plus the service fee), `expectedFeeScheduleVersion` the price list the fee notice quoted (`Offer.serviceFeeScheduleVersion`); the server computes the fee from the list in force and refuses a total or list that no longer matches it (FEE_CHANGED: reload and show the new total). `slotStart` is the agreed day of a flexible-date task. Errors: UNAUTHENTICATED, TERMS_UPDATE_REQUIRED, ACCOUNT_SUSPENDED, ACCOUNT_DELETION_PENDING, PHONE_NOT_VERIFIED, CONSENT_REQUIRED, OFFER_NOT_FOUND, OFFER_NOT_EDITABLE, OFFER_NEEDS_UPDATE, OFFER_CHANGED, FEE_CHANGED, OFFER_NOT_AVAILABLE, TASK_ALREADY_BOOKED, BUSINESS_POSTER_REGISTERED_ONLY, OUT_OF_SERVICE_AREA, INVALID_TASK_DATES, HELPER_CANNOT_TAKE_PAYMENTS, PAYMENT_UNAVAILABLE.
  """
  acceptOffer(offerId: ID!, expectedPriceCents: Int!, expectedTotalCents: Int!, expectedFeeScheduleVersion: String!, consent: CheckoutConsentInput!, slotStart: DateTime = null): CheckoutSession!

  """
  Cancel your booking as its poster, while the payment is held. The refund is the one `cancelPreview` shows: it is worked out again on the server, and Stripe confirms it (the booking becomes REFUNDED or PARTIALLY_SETTLED). `expectedRefundCents` is the preview's `refundCents` the poster saw. Errors: UNAUTHENTICATED, BOOKING_NOT_FOUND, BOOKING_ACTION_NOT_ALLOWED, WORK_STARTED, CANCELLATION_CHANGED.
  """
  cancelBooking(id: ID!, reason: PosterCancelReason!, expectedRefundCents: Int!): Booking!

  """
  Withdraw from the contract (the withdrawal button), while `withdrawalAvailable`: before the start a full refund, after it support works out the part already done and refunds the rest. `name` and `email` are the poster's, prefilled from the account (ZZP čl. 81.a(3)); the confirmation is emailed to `email`. Errors: UNAUTHENTICATED, BOOKING_NOT_FOUND, BOOKING_ACTION_NOT_ALLOWED, WITHDRAWAL_NOT_AVAILABLE, INVALID_WITHDRAWAL_DETAILS.
  """
  withdrawFromContract(id: ID!, name: String!, email: String!): Booking!

  """
  Cancel your booking as its helper, while the payment is held, before or after the start. The poster gets everything back, plus a EUR 5 credit from TaskBeavo when it is under 24 h before the start; you never pay anything, but the cancel counts against your reliability. Stripe confirms the refund (REFUNDED). Errors: UNAUTHENTICATED, BOOKING_NOT_FOUND, BOOKING_ACTION_NOT_ALLOWED.
  """
  cancelAsHelper(id: ID!, reason: HelperCancelReason!): Booking!

  """
  Ask to cancel for a no-fault reason, as the poster or the helper, while the payment is held (also after the start). The other side has 48 hours to agree (a full refund) or disagree (support decides). With no answer, the poster's request stands; the helper's goes to support. Errors: UNAUTHENTICATED, BOOKING_NOT_FOUND, BOOKING_ACTION_NOT_ALLOWED.
  """
  requestNoFaultCancellation(id: ID!, reason: NoFaultReason!): Booking!

  """
  Answer the other side's no-fault request: agree (the poster gets everything back) or disagree (support decides): the helper within the poster's 48 hours (`respondBy`), the poster until support decided. Errors: UNAUTHENTICATED, BOOKING_NOT_FOUND, BOOKING_ACTION_NOT_ALLOWED, NO_FAULT_REPLY_CLOSED.
  """
  respondToNoFaultCancellation(id: ID!, agree: Boolean!): Booking!

  """
  Re-open your task to other offers after your helper cancelled or a no-fault cancel, while `canReopenTask`. The helpers whose offers were declined are told and their offers are live again. Errors: UNAUTHENTICATED, BOOKING_NOT_FOUND, BOOKING_ACTION_NOT_ALLOWED, TASK_NOT_OPEN_FOR_OFFERS.
  """
  reopenTask(bookingId: ID!): Booking!

  """
  As the helper, on the day of the job: On my way, with an optional ETA in minutes (1 to 240). The poster is told. Errors: UNAUTHENTICATED, BOOKING_NOT_FOUND, BOOKING_ACTION_NOT_ALLOWED, INVALID_ETA.
  """
  markOnMyWay(bookingId: ID!, etaMinutes: Int = null): Booking!

  """
  As the helper: Running late, with the new ETA in minutes from now, past the booked start. The poster may keep the booking or cancel for free. Errors: UNAUTHENTICATED, BOOKING_NOT_FOUND, BOOKING_ACTION_NOT_ALLOWED, INVALID_ETA.
  """
  reportRunningLate(bookingId: ID!, etaMinutes: Int!): Booking!

  """
  As the helper: I've arrived. Errors: UNAUTHENTICATED, BOOKING_NOT_FOUND, BOOKING_ACTION_NOT_ALLOWED.
  """
  markArrived(bookingId: ID!): Booking!

  """
  As the poster, after Running late (`arrival.canAnswerLate`): keep the booking, or cancel for free (keep false): a full refund, nobody's fault. Errors: UNAUTHENTICATED, BOOKING_NOT_FOUND, BOOKING_ACTION_NOT_ALLOWED.
  """
  respondToLateArrival(bookingId: ID!, keep: Boolean!): Booking!

  """
  As the poster: did your helper come? Yes after the start; no once `arrival.noShowDueAt` passed. No cancels the booking as the helper's (a full refund, plus a EUR 5 credit from TaskBeavo when it was under 24 h before the start) once the helper's 24 hours to contest are over, or support upholds it. Errors: UNAUTHENTICATED, BOOKING_NOT_FOUND, BOOKING_ACTION_NOT_ALLOWED.
  """
  confirmHelperArrival(bookingId: ID!, came: Boolean!): Booking!

  """
  As the helper, within 24 hours of the poster saying you didn't come (`arrival.canContestNoShow`): 'I was there'. Support decides from the booking's record; nothing is refunded or counted against you until then. Errors: UNAUTHENTICATED, BOOKING_NOT_FOUND, BOOKING_ACTION_NOT_ALLOWED.
  """
  contestNoShow(bookingId: ID!): Booking!

  """
  As the arrived helper, before the booked start: ask the poster to start now. Lapses at the booked start. Errors: UNAUTHENTICATED, BOOKING_NOT_FOUND, BOOKING_ACTION_NOT_ALLOWED.
  """
  requestEarlyStart(bookingId: ID!): Booking!

  """
  As the poster: confirm the helper's Start now (the job starts now: from then on you can't cancel, you open a dispute instead, or withdraw while that's offered) or decline it (the booked time stays). `locale` is the language the screen showed the confirmation in; it is recorded with it. Errors: UNAUTHENTICATED, BOOKING_NOT_FOUND, BOOKING_ACTION_NOT_ALLOWED.
  """
  respondToEarlyStart(bookingId: ID!, confirm: Boolean!, locale: Locale = null): Booking!

  """
  Save an on-site contact. Errors: UNAUTHENTICATED, CARE_CONTACT_AGREEMENT_REQUIRED, INVALID_CARE_CONTACT, INVALID_CARE_CONTACT_PHONE.
  """
  createCareContact(input: CreateCareContactInput!): CareContact!

  """
  Change an on-site contact; omitted fields stay as they are. Active bookings see the change at once. Errors: UNAUTHENTICATED, CARE_CONTACT_NOT_FOUND, CARE_CONTACT_LOCKED, INVALID_CARE_CONTACT, INVALID_CARE_CONTACT_PHONE.
  """
  updateCareContact(id: ID!, input: UpdateCareContactInput!): CareContact!

  """
  Delete an on-site contact; returns it as it was. Errors: UNAUTHENTICATED, CARE_CONTACT_NOT_FOUND, CARE_CONTACT_IN_USE.
  """
  deleteCareContact(id: ID!): CareContact!

  """
  Create or change the signed-in user's helper profile, one onboarding step at a time. Errors: UNAUTHENTICATED, INVALID_OIB, OIB_IN_USE, INVALID_IBAN, INVALID_VAT_ID, INVALID_HELPER_DETAILS, UNDERAGE, HELPER_ADDRESS_NOT_IN_CROATIA (offer joinWaitlist), SERVICE_AREA_NOT_FOUND.
  """
  updateHelperProfile(input: UpdateHelperProfileInput!): HelperProfile!

  """
  Open the signed-in helper's Stripe Express account on first use and return a link to Stripe's onboarding (identity check and IBAN). Also the way to give Stripe the information it asks for later. Errors: UNAUTHENTICATED, HELPER_PROFILE_INCOMPLETE (a Croatian address and the OIB come first), PAYOUT_ACCOUNT_REJECTED.
  """
  startPayoutOnboarding: PayoutOnboardingLink!

  """
  Record a choice about analytics or news and offers by email or push, as a new CONSENT row with the cookie policy or privacy notice version in force in `language`. Signed out, only the web cookie banner's ANALYTICS choice is accepted, with the browser's random `visitorId` (a UUID). Errors: UNAUTHENTICATED, CONSENT_UNAVAILABLE (agreeing while no policy is in force).
  """
  setConsent(purpose: ConsentPurpose!, granted: Boolean!, language: Locale!, visitorId: String = null): ConsentState!

  """
  Switch a category on or off for one channel. Errors: UNAUTHENTICATED, NOTIFICATION_PREFERENCE_LOCKED (booking and payment).
  """
  setNotificationPreference(category: NotificationCategory!, channel: NotificationChannel!, enabled: Boolean!): NotificationPreference!

  """
  Register this device's Expo push token for the signed-in session. A token still live for another account is refused: sign out there first, which removes it. Errors: UNAUTHENTICATED, INVALID_PUSH_TOKEN.
  """
  registerPushToken(token: String!, platform: PushPlatform!): PushDevice!

  """
  Stop pushes to this token, e.g. when the user turns notifications off on the device. Returns whether the token was registered to the signed-in user. Errors: UNAUTHENTICATED.
  """
  unregisterPushToken(token: String!): Boolean!

  """
  Send an offer on an open task; it lasts 7 days, never past the task's date. Errors: UNAUTHENTICATED, TERMS_UPDATE_REQUIRED, ACCOUNT_SUSPENDED, ACCOUNT_DELETION_PENDING, PHONE_NOT_VERIFIED, HELPER_PROFILE_INCOMPLETE, PAYOUT_ACCOUNT_NOT_READY, BUSINESS_ADDRESS_REQUIRED, TASK_NOT_FOUND, OFFER_ON_OWN_TASK, OFFER_ALREADY_SENT, TASK_NOT_OPEN_FOR_OFFERS, BUSINESS_POSTER_REGISTERED_ONLY, OUT_OF_SERVICE_AREA, TASK_OUTSIDE_HELPER_AREAS, OFFER_PRICE_BELOW_MINIMUM, INVALID_OFFER_DETAILS, OFFER_MESSAGE_CONTACT_DETAILS.
  """
  sendOffer(input: SendOfferInput!): Offer!

  """
  Change your open offer, or confirm one that NEEDS_UPDATE; it is SENT again. Errors: UNAUTHENTICATED, TERMS_UPDATE_REQUIRED, ACCOUNT_SUSPENDED, ACCOUNT_DELETION_PENDING, PHONE_NOT_VERIFIED, HELPER_PROFILE_INCOMPLETE, PAYOUT_ACCOUNT_NOT_READY, BUSINESS_ADDRESS_REQUIRED, OFFER_NOT_FOUND, OFFER_NOT_EDITABLE, TASK_NOT_OPEN_FOR_OFFERS, BUSINESS_POSTER_REGISTERED_ONLY, OUT_OF_SERVICE_AREA, TASK_OUTSIDE_HELPER_AREAS, OFFER_PRICE_BELOW_MINIMUM, INVALID_OFFER_DETAILS, OFFER_MESSAGE_CONTACT_DETAILS.
  """
  updateOffer(id: ID!, input: UpdateOfferInput!): Offer!

  """
  Give your offer another 7 days from now, never past the task's date; an expired offer is SENT again. Errors: UNAUTHENTICATED, TERMS_UPDATE_REQUIRED, ACCOUNT_SUSPENDED, ACCOUNT_DELETION_PENDING, PHONE_NOT_VERIFIED, HELPER_PROFILE_INCOMPLETE, PAYOUT_ACCOUNT_NOT_READY, BUSINESS_ADDRESS_REQUIRED, OFFER_NOT_FOUND, OFFER_NOT_EDITABLE, OFFER_ALREADY_SENT, TASK_NOT_OPEN_FOR_OFFERS, BUSINESS_POSTER_REGISTERED_ONLY, OUT_OF_SERVICE_AREA, TASK_OUTSIDE_HELPER_AREAS.
  """
  renewOffer(id: ID!): Offer!

  """
  Withdraw your open offer. Errors: UNAUTHENTICATED, OFFER_NOT_FOUND, OFFER_NOT_EDITABLE.
  """
  withdrawOffer(id: ID!): Offer!

  """
  Save a draft: a new one without `id`, or change your draft. Fields may stay empty; the ones given are checked. Errors: UNAUTHENTICATED, TASK_NOT_FOUND, TASK_NOT_EDITABLE, OUT_OF_SERVICE_AREA, INVALID_TASK_DETAILS, INVALID_TASK_DATES, BUDGET_BELOW_MINIMUM, CARE_CONTACT_NOT_FOUND, UPLOAD_NOT_FOUND.
  """
  saveTaskDraft(input: TaskInput!, id: ID = null): TaskPayload!

  """
  Post a task. It is OPEN, or PENDING_REVIEW when its text is held for review. Errors: UNAUTHENTICATED, TERMS_UPDATE_REQUIRED, ACCOUNT_SUSPENDED, ACCOUNT_DELETION_PENDING, PHONE_NOT_VERIFIED, OUT_OF_SERVICE_AREA, INVALID_TASK_DETAILS, INVALID_TASK_DATES, BUDGET_BELOW_MINIMUM, CARE_CONTACT_NOT_FOUND, UPLOAD_NOT_FOUND.
  """
  postTask(input: TaskInput!): TaskPayload!

  """
  Publish your draft as saved. Errors: UNAUTHENTICATED, TERMS_UPDATE_REQUIRED, ACCOUNT_SUSPENDED, ACCOUNT_DELETION_PENDING, PHONE_NOT_VERIFIED, TASK_NOT_FOUND, TASK_NOT_EDITABLE, OUT_OF_SERVICE_AREA, INVALID_TASK_DETAILS, INVALID_TASK_DATES, BUDGET_BELOW_MINIMUM, CARE_CONTACT_NOT_FOUND, UPLOAD_NOT_FOUND.
  """
  publishTaskDraft(id: ID!): TaskPayload!

  """
  Change your published task; omitted fields stay as they are. A new address is checked against the service areas again. Once an offer is accepted only the photos and, while the booking is active, the access details can change. An account in limited mode may change only the photos and access details. Errors: UNAUTHENTICATED, PHONE_NOT_VERIFIED, TERMS_UPDATE_REQUIRED, ACCOUNT_SUSPENDED, ACCOUNT_DELETION_PENDING, TASK_NOT_FOUND, TASK_NOT_EDITABLE, TASK_BOOKED, OUT_OF_SERVICE_AREA, INVALID_TASK_DETAILS, INVALID_TASK_DATES, BUDGET_BELOW_MINIMUM, CARE_CONTACT_NOT_FOUND, UPLOAD_NOT_FOUND.
  """
  updateTask(id: ID!, input: TaskInput!): TaskPayload!

  """
  Start a photo upload: returns a presigned PUT URL into private storage. Errors: UNAUTHENTICATED, UPLOAD_TYPE_NOT_ALLOWED, UPLOAD_TOO_LARGE, TOO_MANY_PENDING_UPLOADS, EVIDENCE_NEEDS_APP (evidence from a web session), RATE_LIMITED.
  """
  createUploadUrl(input: CreateUploadUrlInput!): UploadTarget!

  """
  Tell the API the PUT finished. The photo is checked and cleaned in the background: follow `status` with the `upload` query until READY or REJECTED. Errors: UNAUTHENTICATED, UPLOAD_NOT_FOUND, UPLOAD_NOT_RECEIVED (PUT the file first).
  """
  completeUpload(id: ID!): Upload!

  """
  Delete one of your uploads that nothing uses yet (not attached to a task or booking), with its files, freeing its place in the pending-upload limit. Returns the deleted upload's id. Errors: UNAUTHENTICATED, UPLOAD_NOT_FOUND (also for an attached upload).
  """
  discardUpload(id: ID!): ID!
}

"""Support's decision on a no-fault request."""
