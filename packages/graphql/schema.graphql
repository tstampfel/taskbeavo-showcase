  """Masked, e.g. "HR•• •••• •••• •••• •016 0"."""
  ibanMasked: String

  """Masked, e.g. "HR•••••••0698"."""
  vatIdMasked: String

  """DAC7 member state of residence, ISO 3166-1 alpha-2."""
  residenceCountry: String
  categories: [TaskCategory!]!
  serviceAreas: [ServiceArea!]!

