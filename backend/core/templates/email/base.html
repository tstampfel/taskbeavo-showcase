{% load i18n %}<!doctype html>
<html lang="{{ locale }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>{% block title %}TaskBeavo{% endblock %}</title>
</head>
<body style="margin:0;padding:0;background-color:#F5F4EF;color:#17211C;font-family:Manrope,'Segoe UI',Helvetica,Arial,sans-serif;font-size:16px;line-height:1.5;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#F5F4EF;">
<tr><td align="center" style="padding:24px 16px;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:560px;background-color:#FFFFFF;border-radius:12px;overflow:hidden;">
<tr><td style="background-color:#1F5C46;padding:20px 24px;color:#FFFFFF;font-size:22px;font-weight:700;">TaskBeavo</td></tr>
<tr><td style="padding:24px;color:#17211C;">
{% block content %}{% endblock %}
</td></tr>
<tr><td style="padding:16px 24px 24px;border-top:1px solid #E4E2DA;color:#4A544E;font-size:13px;line-height:1.5;">
<p style="margin:0 0 4px;">{% block reason %}{% translate "You're receiving this email because you have a TaskBeavo account." %}{% endblock %}</p>
<p style="margin:0;">{% translate "TaskBeavo · Local help in Croatia" %}</p>
</td></tr>
</table>
</td></tr>
</table>
</body>
</html>
